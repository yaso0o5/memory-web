name: Fix root import paths

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix imports inherited from the original src layout
        run: |
          changed=0
          for file in Awakening.tsx Doors.tsx HoursDial.tsx ListeningRoom.tsx MemoryVault.tsx; do
            if [ -f "$file" ] && grep -q '"../lib/' "$file"; then
              sed -i 's#"../lib/#"./lib/#g' "$file"
              changed=1
            fi
          done
          if [ "$changed" -eq 0 ]; then
            echo "No root import fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Awakening.tsx Doors.tsx HoursDial.tsx ListeningRoom.tsx MemoryVault.tsx
          git commit -m "Fix root component library import paths"
          git push
